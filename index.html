<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IFRS/HKFRS Intelligence Dashboard</title><style>body{margin:0;background:#f4f7fb;color:#172b3a;font:14px/1.55 Arial,"Microsoft YaHei"}header{background:#102a43;color:#fff;padding:24px 4%}.wrap{max-width:1500px;margin:auto;padding:20px}.kpis,.layout{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,1fr)}.layout{grid-template-columns:3fr 1fr;margin-top:14px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 12px #0001}.n{font-size:28px;font-weight:700}.muted{color:#6c7d8d;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{padding:9px;border:1px solid #ccd6df;border-radius:8px;background:white}.table{overflow:auto;max-height:72vh}table{border-collapse:collapse;width:100%;min-width:1200px}th,td{padding:10px;border-bottom:1px solid #e4e9ef;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f8fafc}.pill{padding:3px 8px;border-radius:10px;font-weight:bold}.高{background:#fff1f0;color:#a8071a}.中高{background:#fff7e6;color:#ad6800}.中{background:#f6ffed;color:#237804}a{color:#0a5ca8;text-decoration:none}.source{margin:7px 0;padding:8px;border-bottom:1px solid #eee}@media(max-width:900px){.kpis,.layout{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}</style></head><body><header><h1>IFRS / HKFRS Intelligence Dashboard</h1><div>PwC + IASB / ISSB + HKICPA / HKEX → JSON 数据层 → HTML 看板</div></header><div class="wrap"><div id="msg" class="card">正在读取 data.json…</div><div class="kpis"><div class="card"><span class="muted">动态总数</span><div id="all" class="n">0</div></div><div class="card"><span class="muted">近30天</span><div id="new" class="n">0</div></div><div class="card"><span class="muted">高影响</span><div id="high" class="n">0</div></div><div class="card"><span class="muted">来源</span><div id="sources" class="n">0</div></div><div class="card"><span class="muted">数据更新时间</span><div id="time">--</div></div></div><div class="layout"><div class="card"><div class="filters"><input id="q" placeholder="搜索" oninput="render()"><select id="src" onchange="render()"><option value="">全部来源</option></select><select id="imp" onchange="render()"><option value="">全部影响</option><option>高</option><option>中高</option><option>中</option></select><select id="topic" onchange="render()"><option value="">全部主题</option><option>财务报告</option><option>可持续披露</option><option>香港本地</option></select></div><div class="table"><table><thead><tr><th>日期/动态</th><th>来源</th><th>主题</th><th>影响</th><th>专业要点</th><th>通俗解读</th><th>港股影响与行动</th></tr></thead><tbody id="tb"></tbody></table></div></div><aside><div class="card"><h3>来源状态</h3><div id="sourceList"></div></div><div class="card" style="margin-top:14px"><h3>运行方式</h3><p>本地：先运行 collector.py，再用本地HTTP服务器打开。</p><p>线上：GitHub Actions每天自动更新 data.json，GitHub Pages展示看板。</p><p class="muted">规则化解读用于初筛。正式会计判断须复核官方原文。</p></div></aside></div></div><script>let items=[],meta={};const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('data.json?'+Date.now()).then(r=>r.json()).then(j=>{meta=j;items=j.items||[];init();render()}).catch(x=>document.getElementById('msg').innerHTML='无法读取 data.json。请先运行 collector.py，并通过 HTTP 服务器打开，不能直接双击 file://。');function init(){let ss=[...new Set(items.map(x=>x.source))];document.getElementById('src').innerHTML+ ss.map(x=>`<option>${e(x)}</option>`).join('');document.getElementById('all').textContent=items.length;document.getElementById('high').textContent=items.filter(x=>x.impact==='高').length;document.getElementById('new').textContent=items.filter(x=>x.date&&Date.now()-new Date(x.date)<2592e6).length;document.getElementById('sources').textContent=ss.length;document.getElementById('time').textContent=new Date(meta.generatedAt).toLocaleString();document.getElementById('msg').textContent=meta.errors?.length?'部分来源更新失败，已保留历史数据。':'全部来源采集完成。';document.getElementById('sourceList').innerHTML=ss.map(s=>`<div class="source"><b>${e(s)}</b><br><span class="muted">${items.filter(x=>x.source===s).length} 条</span></div>`).join('')}function render(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('src').value,i=document.getElementById('imp').value,t=document.getElementById('topic').value;let d=items.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!s||x.source===s)&&(!i||x.impact===i)&&(!t||x.topic===t));document.getElementById('tb').innerHTML=d.map(x=>`<tr><td><span class="muted">${e(x.date||'日期待核')}</span><br><a href="${e(x.url)}" target="_blank"><b>${e(x.title)}</b></a><br><span class="muted">${e((x.summary||'').slice(0,180))}</span></td><td>${e(x.source)}</td><td>${e(x.topic)}</td><td><span class="pill ${e(x.impact)}">${e(x.impact)}</span></td><td>${e(x.professional)}</td><td>${e(x.plain)}</td><td>${e(x.hkImpact)}</td></tr>`).join('')}</script></body></html>
