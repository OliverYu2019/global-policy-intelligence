<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Policy Intelligence</title><style>
:root{--navy:#0d2438;--blue:#155f92;--bg:#f3f6f9;--line:#e2e8ef;--red:#b42318;--amber:#b54708;--green:#027a48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172b3a;font:14px/1.55 Arial,"Microsoft YaHei",sans-serif}.hide{display:none!important}#gate{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,#255f86,#0d2438 55%);padding:20px}.login{width:min(430px,100%);background:#fff;border-radius:18px;padding:32px;box-shadow:0 25px 80px #0005}.brand{font-size:12px;letter-spacing:1.5px;color:#607689}.login h1{font-size:25px;margin:8px 0}.login p{color:#6a7d8e}.login input{width:100%;padding:13px 14px;border:1px solid #cbd6df;border-radius:9px;font-size:16px}.login button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:#155f92;color:#fff;font-weight:700;cursor:pointer}.err{min-height:22px;margin-top:10px;color:#b42318}.small{font-size:12px;color:#738595;margin-top:15px}header{background:linear-gradient(120deg,#0d2438,#164d73);color:#fff;padding:22px 4%}.head,.wrap{max-width:1540px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}header h1{margin:0;font-size:27px}.subtitle{opacity:.82}.right{text-align:right;font-size:12px}.right button{margin-top:7px;border:1px solid #ffffff80;border-radius:7px;background:transparent;color:#fff;padding:5px 11px;cursor:pointer}.wrap{padding:18px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.nav button,.filters input,.filters select{border:1px solid #cdd7e1;background:#fff;border-radius:8px;padding:9px 12px}.nav button{cursor:pointer;font-weight:700}.nav button.active{background:#165f96;color:#fff;border-color:#165f96}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 12px #102a4310}.kpi .n{font-size:28px;font-weight:700}.muted{color:#6b7f90;font-size:12px}.top{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.lead{padding:13px 0;border-bottom:1px solid var(--line)}.lead a,a{color:#104e7a;text-decoration:none}.matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.topicCard{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}.layout{display:grid;grid-template-columns:minmax(0,3fr) 310px;gap:14px;margin-top:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input{min-width:230px}.table{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;min-width:1160px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f8fafc}.pill{display:inline-block;padding:3px 8px;border-radius:11px;font-weight:700;font-size:12px}.高{background:#fee4e2;color:var(--red)}.中高{background:#ffead5;color:var(--amber)}.中{background:#dcfae6;color:var(--green)}.source-row{padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.top,.layout{grid-template-columns:1fr}.matrix{grid-template-columns:repeat(2,1fr)}.head{display:block}.right{text-align:left;margin-top:8px}}
</style></head><body>
<div id="gate"><div class="login"><div class="brand">GLOBAL POLICY INTELLIGENCE</div><h1>全球政策与市场情报平台</h1><p>请输入访问密码进入看板。</p><input id="pwd" type="password" autocomplete="current-password" placeholder="访问密码" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">进入看板</button><div id="err" class="err"></div><div class="small">登录状态将在当前设备保留 8 小时。</div></div></div>
<div id="app" class="hide"><header><div class="head"><div><h1>全球政策、可持续发展与市场情报</h1><div class="subtitle">中国 · 香港 · 美国 · 欧盟 · 全球｜政策法规 · 热点新闻 · 交易与竞争 · 宏观与央行</div></div><div class="right">数据更新：<span id="updated">--</span><br>自动刷新：每小时<br><button onclick="logout()">退出</button></div></div></header><main class="wrap"><div class="kpis"><div class="card kpi"><span class="muted">近30天新增</span><div id="kNew" class="n">0</div></div><div class="card kpi"><span class="muted">高影响</span><div id="kHigh" class="n">0</div></div><div class="card kpi"><span class="muted">征求意见</span><div id="kConsult" class="n">0</div></div><div class="card kpi"><span class="muted">政策法规</span><div id="kPolicy" class="n">0</div></div><div class="card kpi"><span class="muted">热点新闻</span><div id="kNews" class="n">0</div></div><div class="card kpi"><span class="muted">覆盖来源</span><div id="kSources" class="n">0</div></div></div><div class="top"><div class="card"><h2>本期重点</h2><div id="leads"></div></div><div class="card"><h2>主题分布</h2><div id="topicCards" class="matrix"></div></div></div><div class="layout"><div class="card"><h2>情报库</h2><div class="filters"><input id="q" placeholder="搜索标题、机构或摘要" oninput="render()"><select id="region" onchange="render()"><option value="">全部地区</option></select><select id="topic" onchange="render()"><option value="">全部主题</option></select><select id="impact" onchange="render()"><option value="">全部影响</option><option>高</option><option>中高</option><option>中</option></select><select id="section" onchange="render()"><option value="">全部板块</option><option>政策法规</option><option>热点新闻</option></select></div><div id="mainTable"></div></div><aside class="card"><h3>来源覆盖</h3><div id="sourceList"></div></aside></div></main></div>
<script>
/* IMPORTANT: replace PASS_HASH with SHA-256 of your chosen password. The included default password is ChangeMe-2026! */
const PASS_HASH='4716e6fb9dabadf58c328d20adfbbb37b40ad5d60735fa1897544c74fea73f70'; const HOURS=8, MAX_FAILS=5, LOCK_MIN=5; let items=[],meta={};
async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){let lock=+localStorage.getItem('gp_lock')||0;if(Date.now()<lock){err.textContent='尝试次数过多，请稍后再试。';return}if(await hash(pwd.value)===PASS_HASH){localStorage.setItem('gp_auth_until',Date.now()+HOURS*3600000);localStorage.removeItem('gp_fails');localStorage.removeItem('gp_lock');showApp()}else{let n=(+localStorage.getItem('gp_fails')||0)+1;localStorage.setItem('gp_fails',n);if(n>=MAX_FAILS){localStorage.setItem('gp_lock',Date.now()+LOCK_MIN*60000);localStorage.setItem('gp_fails',0);err.textContent='错误次数过多，已临时锁定 5 分钟。'}else err.textContent=`访问密码错误，还可尝试 ${MAX_FAILS-n} 次。`}}
function logout(){localStorage.removeItem('gp_auth_until');location.reload()}function showApp(){gate.classList.add('hide');app.classList.remove('hide');loadData()}if(Date.now()<+localStorage.getItem('gp_auth_until'))showApp();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadData(){fetch('data.json?'+Date.now()).then(r=>r.json()).then(j=>{meta=j;items=j.items||[];init()}).catch(()=>mainTable.innerHTML='<p>数据暂时无法读取，请稍后刷新。</p>')}
function init(){updated.textContent=new Date(meta.generatedAt).toLocaleString();let src=[...new Set(items.map(x=>x.authority))],regs=[...new Set(items.map(x=>x.jurisdiction))],tops=[...new Set(items.map(x=>x.topic))];region.innerHTML+=regs.map(x=>`<option>${esc(x)}</option>`).join('');topic.innerHTML+=tops.map(x=>`<option>${esc(x)}</option>`).join('');kNew.textContent=items.filter(x=>x.datePublished&&Date.now()-new Date(x.datePublished)<30*864e5).length;kHigh.textContent=items.filter(x=>x.impactLevel==='高').length;kConsult.textContent=items.filter(x=>String(x.legalStatus).includes('征求')).length;kPolicy.textContent=items.filter(x=>x.section==='政策法规').length;kNews.textContent=items.filter(x=>x.section==='热点新闻').length;kSources.textContent=src.length;leads.innerHTML=items.filter(x=>x.impactLevel==='高').slice(0,6).map(x=>`<div class="lead"><a href="${esc(x.originalUrl)}" target="_blank"><b>${esc(x.title)}</b></a><br><span class="muted">${esc(x.jurisdiction)} · ${esc(x.topic)} · ${esc(x.authority)}</span></div>`).join('');topicCards.innerHTML=tops.slice(0,16).map(t=>`<div class="topicCard"><b>${esc(t)}</b><br><span class="muted">${items.filter(x=>x.topic===t).length} 条</span></div>`).join('');sourceList.innerHTML=src.map(s=>`<div class="source-row"><b>${esc(s)}</b><br><span class="muted">${items.filter(x=>x.authority===s).length} 条</span></div>`).join('');render()}
function table(d){return `<div class="table"><table><thead><tr><th>日期与动态</th><th>地区/机构</th><th>板块</th><th>影响</th><th>专业解读</th><th>企业影响</th></tr></thead><tbody>${d.map(x=>`<tr><td><span class="muted">${esc(x.datePublished||'日期待核')}</span><br><a href="${esc(x.originalUrl)}" target="_blank"><b>${esc(x.title)}</b></a><br><span class="muted">${esc((x.summary||'').slice(0,180))}</span></td><td>${esc(x.jurisdiction)}<br>${esc(x.authority)}</td><td>${esc(x.section)}<br><b>${esc(x.topic)}</b></td><td><span class="pill ${esc(x.impactLevel)}">${esc(x.impactLevel)}</span><br><span class="muted">${esc(x.legalStatus)}</span></td><td>${esc(x.professionalSummary)}</td><td>${esc(x.companyImpact)}</td></tr>`).join('')}</tbody></table></div>`}
function render(){let z=q.value.toLowerCase(),r=region.value,t=topic.value,i=impact.value,s=section.value,d=items.filter(x=>(!z||JSON.stringify(x).toLowerCase().includes(z))&&(!r||x.jurisdiction===r)&&(!t||x.topic===t)&&(!i||x.impactLevel===i)&&(!s||x.section===s));mainTable.innerHTML=table(d)}setTimeout(()=>{if(!app.classList.contains('hide'))location.reload()},3600000);
</script></body></html>
