<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>全球政策与市场情报</title>
<script src="config.js"></script>
<style>
:root{--navy:#0d2438;--blue:#155f92;--bg:#f3f6f9;--line:#e3e8ee;--txt:#1b2b39;--mut:#667788;--red:#b42318;--amber:#b54708;--green:#027a48}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--blue);text-decoration:none}
.hide{display:none!important}
p,li,div,span,a{overflow-wrap:anywhere;word-break:break-word}

/* 登录 */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top right,#255f86,#0d2438 60%)}
.login{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 20px 60px #0005}
.login small{letter-spacing:1.5px;color:var(--mut);font-size:11px}
.login h1{font-size:21px;margin:6px 0 4px}
.login p{color:var(--mut);margin:0 0 16px;font-size:14px}
.login input{width:100%;padding:13px;border:1px solid #cbd6df;border-radius:10px;font-size:16px}
.login button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:16px;font-weight:700}
.err{min-height:20px;margin-top:10px;color:var(--red);font-size:13px}

/* 顶部 */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 14px calc(10px);box-shadow:0 2px 10px #0003}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1200px;margin:auto}
.hrow h1{font-size:17px;margin:0;line-height:1.3}
.hrow .upd{font-size:11px;opacity:.75}
.hrow button{background:transparent;border:1px solid #ffffff70;color:#fff;border-radius:7px;padding:5px 10px;font-size:12px;flex-shrink:0}
main{max-width:1200px;margin:auto;padding:12px 12px 90px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#fff;border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{font-size:11px;color:var(--mut)}

/* 小结 */
.brief{background:#fff;border-radius:12px;border:1px solid var(--line);padding:14px;margin-top:12px}
.brief h2{font-size:16px;margin:0 0 8px}
.brief ul{margin:0;padding-left:18px}
.brief li{margin-bottom:6px;font-size:14px}

/* 分段与筛选 */
.seg{display:flex;background:#e6ecf2;border-radius:10px;padding:3px;margin:14px 0 10px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:14px;color:var(--txt)}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 4px #0001}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #cdd7e1;background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tools{display:flex;gap:8px;margin:8px 0 12px}
.tools input{flex:1;min-width:0;padding:10px 12px;border:1px solid #cdd7e1;border-radius:10px;font-size:15px}
.tools select{padding:9px 6px;border:1px solid #cdd7e1;border-radius:10px;font-size:14px;background:#fff;max-width:34%}
.count{font-size:12px;color:var(--mut);margin:0 2px 8px}

/* 卡片 */
.list{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;scroll-margin-top:70px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef2f6;color:#3d5266}
.tag.高{background:#fee4e2;color:var(--red);font-weight:700}
.tag.中高{background:#ffead5;color:var(--amber);font-weight:700}
.tag.中{background:#dcfae6;color:var(--green);font-weight:700}
.card h3{font-size:16px;line-height:1.45;margin:0 0 4px}
.meta{font-size:12px;color:var(--mut)}
.one{margin-top:8px;font-size:14px;background:#f3f7fb;border-left:3px solid var(--blue);padding:7px 10px;border-radius:0 6px 6px 0}
.more{margin-top:10px;width:100%;border:1px solid #cdd7e1;background:#fff;border-radius:9px;padding:8px;font-size:14px;color:var(--blue)}
.detail{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.detail h4{font-size:14px;margin:12px 0 4px;color:var(--navy)}
.detail p{margin:0;font-size:14px}
.detail ul{margin:0;padding-left:18px;font-size:14px}
.detail li{margin-bottom:4px}
.ind{display:flex;flex-wrap:wrap;gap:5px}
.ind span{font-size:12px;background:#eef4fa;color:#174a7c;border-radius:10px;padding:2px 8px}
.src{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.src a.btn{display:block;text-align:center;background:var(--blue);color:#fff;border-radius:9px;padding:10px;font-weight:700;font-size:14px}
.src .dom{font-size:11px;color:var(--mut);text-align:center}
.method{font-size:11px;color:var(--mut);margin-top:8px}

/* 底部导航（手机） */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--mut)}
nav.bottom button b{display:block;font-size:17px;line-height:1.1}
nav.bottom button.on{color:var(--blue);font-weight:700}
.top{position:fixed;right:14px;bottom:76px;z-index:25;background:var(--navy);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;opacity:.85}
.foot{font-size:11px;color:var(--mut);text-align:center;margin:20px 0}

/* 桌面 */
@media(min-width:900px){
  .kpis{grid-template-columns:repeat(6,1fr)}
  .list{grid-template-columns:1fr 1fr;align-items:start}
  nav.bottom{display:none}
  main{padding-bottom:30px}
  .hrow h1{font-size:20px}
  .top{bottom:24px}
}
</style>
</head>
<body>

<div id="gate">
  <div class="login">
    <small>GLOBAL POLICY INTELLIGENCE</small>
    <h1>全球政策与市场情报</h1>
    <p>请输入访问密码</p>
    <input id="pwd" type="password" autocomplete="current-password" placeholder="访问密码" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">进入</button>
    <div id="err" class="err"></div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <div class="hrow">
      <div><h1>全球政策与市场情报</h1><div class="upd">更新于 <span id="updated">--</span></div></div>
      <button onclick="logout()">退出</button>
    </div>
  </header>

  <main>
    <section class="kpis">
      <div class="kpi"><b id="kNew">0</b><span>近30天</span></div>
      <div class="kpi"><b id="kHigh">0</b><span>高影响</span></div>
      <div class="kpi"><b id="kConsult">0</b><span>征求意见</span></div>
      <div class="kpi"><b id="kPolicy">0</b><span>政策法规</span></div>
      <div class="kpi"><b id="kNews">0</b><span>热点新闻</span></div>
      <div class="kpi"><b id="kRegion">0</b><span>覆盖地区</span></div>
    </section>

    <section class="brief" id="briefBox">
      <h2>本期小结</h2>
      <ul id="brief"></ul>
    </section>

    <div class="seg" id="seg">
      <button data-s="" class="on">全部</button>
      <button data-s="政策法规">政策法规</button>
      <button data-s="热点新闻">热点新闻</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="tools">
      <input id="q" type="search" placeholder="搜索标题、机构、关键词" oninput="render()">
      <select id="region" onchange="render()"><option value="">全部地区</option></select>
      <select id="impact" onchange="render()"><option value="">全部影响</option><option>高</option><option>中高</option><option>中</option></select>
    </div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
    <div class="foot">解读仅供内部参考，不构成法律或会计意见；正式判断请以原文为准。</div>
  </main>

  <button class="top hide" id="topBtn" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
  <nav class="bottom" id="bnav">
    <button data-s="" class="on"><b>◎</b>全部</button>
    <button data-s="政策法规"><b>§</b>政策</button>
    <button data-s="热点新闻"><b>◆</b>新闻</button>
    <button data-search="1"><b>⌕</b>搜索</button>
  </nav>
</div>

<script>
const PASS = window.PASS_HASH || '6f649b462dae46f477f06668b6e1ce3ef280e01fbe4260f50602c75a07a6c8e8';
const HOURS = 8, MAX_FAILS = 5, LOCK_MIN = 5;
let items = [], meta = {}, state = {section: '', topic: ''};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){
  const lock=+localStorage.getItem('gp_lock')||0;
  if(Date.now()<lock){$('err').textContent='尝试次数过多，请稍后再试。';return}
  if(await sha($('pwd').value)===PASS){localStorage.setItem('gp_until',Date.now()+HOURS*36e5);localStorage.removeItem('gp_fails');show()}
  else{const n=(+localStorage.getItem('gp_fails')||0)+1;localStorage.setItem('gp_fails',n);
    if(n>=MAX_FAILS){localStorage.setItem('gp_lock',Date.now()+LOCK_MIN*6e4);localStorage.setItem('gp_fails',0);$('err').textContent='错误次数过多，已锁定5分钟。'}
    else $('err').textContent=`密码错误，还可尝试 ${MAX_FAILS-n} 次。`}
}
function logout(){localStorage.removeItem('gp_until');location.hash='';location.reload()}
function show(){$('gate').classList.add('hide');$('app').classList.remove('hide');load()}
if(Date.now()<(+localStorage.getItem('gp_until')||0)) show();

function load(){
  fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{meta=j;items=(j.items||[]).filter(x=>x.title);init()})
  .catch(()=>{$('list').innerHTML='<div class="card">数据暂时无法读取，请稍后刷新。</div>'});
}
const recent = x => x.datePublished && (Date.now()-new Date(x.datePublished))<30*864e5;
const domain = u => {try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};

function init(){
  $('updated').textContent = meta.generatedAt ? new Date(meta.generatedAt).toLocaleString('zh-CN',{hour12:false}) : '--';
  $('kNew').textContent = items.filter(recent).length;
  $('kHigh').textContent = items.filter(x=>x.impactLevel==='高').length;
  $('kConsult').textContent = items.filter(x=>/征求|提案/.test(x.legalStatus||'')).length;
  $('kPolicy').textContent = items.filter(x=>x.section==='政策法规').length;
  $('kNews').textContent = items.filter(x=>x.section==='热点新闻').length;
  const regs=[...new Set(items.map(x=>x.jurisdiction).filter(Boolean))];
  $('kRegion').textContent = regs.length;
  $('region').innerHTML = '<option value="">全部地区</option>'+regs.map(r=>`<option>${esc(r)}</option>`).join('');
  buildBrief(); buildChips(); render(); openHash();
}

function buildBrief(){
  const pool = items.filter(recent).length ? items.filter(recent) : items;
  const high = pool.filter(x=>x.impactLevel==='高');
  const cnt = {}; pool.forEach(x=>cnt[x.topic]=(cnt[x.topic]||0)+1);
  const topT = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k}（${v}）`).join('、');
  const lines = [`近30天收录 ${pool.length} 条，其中高影响 ${high.length} 条；主要集中在 ${topT}。`];
  (high.length?high:pool).slice(0,4).forEach(x=>lines.push(`<a href="#${esc(x.id)}" onclick="jump('${esc(x.id)}');return false"><b>${esc(x.jurisdiction)}·${esc(x.topic)}</b></a>：${esc(x.oneLiner||x.title)}`));
  $('brief').innerHTML = lines.map(l=>`<li>${l}</li>`).join('');
}

function buildChips(){
  const pool = items.filter(x=>!state.section||x.section===state.section);
  const cnt = {}; pool.forEach(x=>cnt[x.topic]=(cnt[x.topic]||0)+1);
  const order = ['气候','水','废弃物','大气污染物','生物多样性','零毁林','人权','反垄断','供应链安全','财务准则','全球与贸易','并购交易','央行与市场'];
  const topics = Object.keys(cnt).sort((a,b)=>(order.indexOf(a)+99*(order.indexOf(a)<0))-(order.indexOf(b)+99*(order.indexOf(b)<0)));
  if(state.topic && !cnt[state.topic]) state.topic='';
  $('chips').innerHTML = `<button class="chip ${state.topic?'':'on'}" data-t="">全部主题</button>` +
    topics.map(t=>`<button class="chip ${state.topic===t?'on':''}" data-t="${esc(t)}">${esc(t)} ${cnt[t]}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.topic=b.dataset.t;buildChips();render()});
}

function setSection(s){
  state.section=s;
  document.querySelectorAll('#seg button,#bnav button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  buildChips(); render(); scrollTo({top:$('seg').offsetTop-60,behavior:'smooth'});
}
document.querySelectorAll('#seg button,#bnav button[data-s]').forEach(b=>b.onclick=()=>setSection(b.dataset.s));
document.querySelector('#bnav button[data-search]').onclick=()=>{scrollTo({top:$('seg').offsetTop-60,behavior:'smooth'});setTimeout(()=>$('q').focus(),300)};

const list = (arr, cls='') => (arr&&arr.length)?`<ul class="${cls}">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
function card(x){
  const d = domain(x.originalUrl);
  return `<article class="card" id="${esc(x.id)}">
  <div class="tags"><span class="tag ${esc(x.impactLevel)}">${esc(x.impactLevel)}影响</span><span class="tag">${esc(x.jurisdiction)}</span><span class="tag">${esc(x.topic)}</span><span class="tag">${esc(x.legalStatus)}</span></div>
  <h3>${esc(x.title)}</h3>
  <div class="meta">${esc(x.authority)} · ${esc(x.datePublished||'日期待核')}</div>
  ${x.oneLiner?`<div class="one">${esc(x.oneLiner)}</div>`:''}
  <button class="more" onclick="toggle('${esc(x.id)}',this)">展开完整解读 ▾</button>
  <div class="detail hide">
    ${x.keyPoints&&x.keyPoints.length?`<h4>关键要点</h4>${list(x.keyPoints)}`:''}
    ${x.professionalAnalysis?`<h4>专业解读</h4><p>${esc(x.professionalAnalysis)}</p>`:''}
    ${x.plainLanguage?`<h4>通俗解读</h4><p>${esc(x.plainLanguage)}</p>`:''}
    ${x.hkImpact?`<h4>对港股/中资企业的影响</h4><p>${esc(x.hkImpact)}</p>`:''}
    ${x.industries&&x.industries.length?`<h4>主要影响行业</h4><div class="ind">${x.industries.map(i=>`<span>${esc(i)}</span>`).join('')}</div>`:''}
    ${x.actions&&x.actions.length?`<h4>建议动作</h4>${list(x.actions)}`:''}
    ${x.watchItems&&x.watchItems.length?`<h4>后续关注</h4>${list(x.watchItems)}`:''}
    <div class="src"><a class="btn" href="${esc(x.originalUrl)}" target="_blank" rel="noopener">阅读原文 ↗</a><span class="dom">来源：${esc(d)}${x.sourceType==='news'?'（新闻报道）':''}</span></div>
    <div class="method">${x.analysisMethod==='AI生成'?'解读由AI基于原文生成，仅供参考':x.analysisMethod==='规则生成'?'解读为规则初筛，深度解读待补充':'解读已人工复核'}</div>
  </div></article>`;
}
function toggle(id,btn){const d=$(id).querySelector('.detail');const open=d.classList.toggle('hide');btn.textContent=open?'展开完整解读 ▾':'收起 ▴'}

function render(){
  const q=$('q').value.trim().toLowerCase(), r=$('region').value, im=$('impact').value;
  const rank={'高':0,'中高':1,'中':2};
  const d = items.filter(x=>(!state.section||x.section===state.section)&&(!state.topic||x.topic===state.topic)&&(!r||x.jurisdiction===r)&&(!im||x.impactLevel===im)
     &&(!q||[x.title,x.authority,x.oneLiner,x.topic,x.jurisdiction,(x.keyPoints||[]).join(' ')].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(b.datePublished||'').localeCompare(a.datePublished||'')||(rank[a.impactLevel]-rank[b.impactLevel]));
  $('count').textContent = `共 ${d.length} 条`;
  $('list').innerHTML = d.length ? d.map(card).join('') : '<div class="card">暂无符合条件的内容。</div>';
}

function jump(id){
  state.section='';state.topic='';$('q').value='';$('region').value='';$('impact').value='';
  document.querySelectorAll('#seg button,#bnav button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===''));
  buildChips();render();
  const el=$(id); if(!el) return;
  const btn=el.querySelector('.more'); if(el.querySelector('.detail').classList.contains('hide')) toggle(id,btn);
  el.scrollIntoView({behavior:'smooth',block:'start'});
}
function openHash(){const id=decodeURIComponent(location.hash.slice(1)); if(id) setTimeout(()=>jump(id),150)}
window.addEventListener('hashchange',openHash);
window.addEventListener('scroll',()=>$('topBtn').classList.toggle('hide',scrollY<700),{passive:true});
setInterval(()=>{if(!$('app').classList.contains('hide')) load()},36e5);
</script>
</body>
</html>
