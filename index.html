<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球政策、可持续发展与市场情报</title><style>
:root{--navy:#0d2438;--blue:#1866a3;--bg:#f3f6f9;--line:#e2e8ef;--red:#b42318;--amber:#b54708;--green:#027a48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172b3a;font:14px/1.55 Arial,"Microsoft YaHei",sans-serif}header{background:linear-gradient(120deg,#0d2438,#164d73);color:#fff;padding:25px 4%}.head,.wrap{max-width:1540px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font-size:28px}.subtitle{opacity:.82}.stamp{text-align:right;font-size:12px}.wrap{padding:18px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.nav button,.filters input,.filters select{border:1px solid #cdd7e1;background:#fff;border-radius:8px;padding:9px 12px}.nav button{cursor:pointer;font-weight:700}.nav button.active{background:#165f96;color:#fff;border-color:#165f96}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 12px #102a4310}.kpi .n{font-size:28px;font-weight:700}.muted{color:#6b7f90;font-size:12px}.top{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.lead{padding:13px 0;border-bottom:1px solid var(--line)}.lead a{font-weight:700;color:#104e7a;text-decoration:none}.matrix{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.topic{padding:12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:#fbfcfe}.topic b{display:block}.layout{display:grid;grid-template-columns:minmax(0,3fr) 310px;gap:14px;margin-top:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input{min-width:230px}.table{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;min-width:1220px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f8fafc;z-index:1}.pill{display:inline-block;padding:3px 8px;border-radius:11px;font-weight:700;font-size:12px}.高{background:#fee4e2;color:var(--red)}.中高{background:#ffead5;color:var(--amber)}.中{background:#dcfae6;color:var(--green)}.S{background:#e0f2fe;color:#075985}.A{background:#e0e7ff;color:#3730a3}.B{background:#f3e8ff;color:#6b21a8}.source-row{padding:9px 0;border-bottom:1px solid var(--line)}.section{display:none}.section.active{display:block}@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.top,.layout{grid-template-columns:1fr}.matrix{grid-template-columns:repeat(2,1fr)}.head{display:block}.stamp{text-align:left;margin-top:10px}}
</style></head><body><header><div class="head"><div><h1>全球政策、可持续发展与市场情报</h1><div class="subtitle">中国 · 香港 · 美国 · 欧盟 · 全球｜政策法规 · 热点新闻 · 交易与竞争 · 宏观与央行</div></div><div class="stamp">数据更新：<span id="updated">--</span><br>自动刷新频率：每小时</div></div></header><main class="wrap"><nav class="nav"><button class="active" data-tab="home">首页</button><button data-tab="policy">政策法规</button><button data-tab="news">热点新闻</button><button data-tab="all">全部情报</button></nav><section id="home" class="section active"><div class="kpis"><div class="card kpi"><span class="muted">近30天新增</span><div class="n" id="kNew">0</div></div><div class="card kpi"><span class="muted">高影响</span><div class="n" id="kHigh">0</div></div><div class="card kpi"><span class="muted">征求意见</span><div class="n" id="kConsult">0</div></div><div class="card kpi"><span class="muted">政策法规</span><div class="n" id="kPolicy">0</div></div><div class="card kpi"><span class="muted">热点新闻</span><div class="n" id="kNews">0</div></div><div class="card kpi"><span class="muted">覆盖来源</span><div class="n" id="kSources">0</div></div></div><div class="top"><div class="card"><h2>本期重点</h2><div id="leads"></div></div><div class="card"><h2>主题导航</h2><div id="topics" class="matrix"></div></div></div></section><section id="policy" class="section"><div class="card"><h2>政策法规</h2><div id="policyTable"></div></div></section><section id="news" class="section"><div class="card"><h2>热点新闻</h2><div id="newsTable"></div></div></section><section id="all" class="section"><div class="card"><h2>全部情报</h2><div id="allTable"></div></div></section><div class="layout"><div class="card"><h2>情报库</h2><div class="filters"><input id="q" placeholder="搜索标题、机构或摘要" oninput="renderMain()"><select id="region" onchange="renderMain()"><option value="">全部地区</option></select><select id="topic" onchange="renderMain()"><option value="">全部主题</option></select><select id="impact" onchange="renderMain()"><option value="">全部影响</option><option>高</option><option>中高</option><option>中</option></select></div><div id="mainTable"></div></div><aside class="card"><h3>来源覆盖</h3><div id="sourceList"></div></aside></div></main><script>
let items=[],meta={};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const days=x=>x&&Date.now()-new Date(x)<30*864e5;fetch('data.json?'+Date.now()).then(r=>r.json()).then(j=>{meta=j;items=j.items||[];init()}).catch(()=>document.body.insertAdjacentHTML('beforeend','<p style="padding:20px;color:#b42318">数据文件读取失败，请确认 data.json 已部署。</p>'));
function table(d){return `<div class="table"><table><thead><tr><th>日期与动态</th><th>地区/机构</th><th>板块</th><th>影响</th><th>专业解读</th><th>企业影响</th></tr></thead><tbody>${d.map(x=>`<tr><td><span class="muted">${esc(x.datePublished||'日期待核')}</span><br><a href="${esc(x.originalUrl)}" target="_blank"><b>${esc(x.title)}</b></a><br><span class="muted">${esc((x.summary||'').slice(0,180))}</span></td><td>${esc(x.jurisdiction)}<br>${esc(x.authority)} <span class="pill ${esc(x.sourceTier)}">${esc(x.sourceTier)}</span></td><td>${esc(x.section)}<br><b>${esc(x.topic)}</b></td><td><span class="pill ${esc(x.impactLevel)}">${esc(x.impactLevel)}</span><br><span class="muted">${esc(x.legalStatus)}</span></td><td>${esc(x.professionalSummary)}</td><td>${esc(x.companyImpact)}</td></tr>`).join('')}</tbody></table></div>`}
function init(){document.getElementById('updated').textContent=new Date(meta.generatedAt).toLocaleString();let src=[...new Set(items.map(x=>x.authority))],regs=[...new Set(items.map(x=>x.jurisdiction))],tops=[...new Set(items.map(x=>x.topic))];region.innerHTML+=regs.map(x=>`<option>${esc(x)}</option>`).join('');topic.innerHTML+=tops.map(x=>`<option>${esc(x)}</option>`).join('');kNew.textContent=items.filter(x=>days(x.datePublished)).length;kHigh.textContent=items.filter(x=>x.impactLevel==='高').length;kConsult.textContent=items.filter(x=>x.legalStatus==='征求意见').length;kPolicy.textContent=items.filter(x=>x.section==='政策法规').length;kNews.textContent=items.filter(x=>x.section==='热点新闻').length;kSources.textContent=src.length;leads.innerHTML=items.filter(x=>x.impactLevel==='高').slice(0,6).map(x=>`<div class="lead"><a href="${esc(x.originalUrl)}" target="_blank">${esc(x.title)}</a><br><span class="muted">${esc(x.jurisdiction)} · ${esc(x.topic)} · ${esc(x.authority)}</span></div>`).join('');topics.innerHTML=tops.map(t=>`<div class="topic" onclick="selectTopic('${esc(t)}')"><b>${esc(t)}</b><span class="muted">${items.filter(x=>x.topic===t).length} 条</span></div>`).join('');sourceList.innerHTML=src.map(s=>`<div class="source-row"><b>${esc(s)}</b><br><span class="muted">${items.filter(x=>x.authority===s).length} 条</span></div>`).join('');policyTable.innerHTML=table(items.filter(x=>x.section==='政策法规'));newsTable.innerHTML=table(items.filter(x=>x.section==='热点新闻'));allTable.innerHTML=table(items);renderMain()}
function renderMain(){let z=q.value.toLowerCase(),r=region.value,t=topic.value,i=impact.value;let d=items.filter(x=>(!z||JSON.stringify(x).toLowerCase().includes(z))&&(!r||x.jurisdiction===r)&&(!t||x.topic===t)&&(!i||x.impactLevel===i));mainTable.innerHTML=table(d)}function selectTopic(t){topic.value=t;renderMain();document.querySelector('.layout').scrollIntoView({behavior:'smooth'})}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});setTimeout(()=>location.reload(),3600000);
</script></body></html>
