name: Update Global Policy Dashboard

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: '发送测试邮件（不需要有新增情报）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: policy-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email == true }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.mime.text import MIMEText
          from email.header import Header

          host = os.environ['SMTP_SERVER']
          port = int(os.environ.get('SMTP_PORT', '465'))
          user = os.environ['SMTP_USERNAME']
          password = os.environ['SMTP_PASSWORD'].replace(' ', '')
          sender = os.environ.get('ALERT_EMAIL_FROM') or user
          recipients = [x.strip() for x in os.environ['ALERT_EMAIL_TO'].split(',') if x.strip()]
          dashboard = os.environ.get('DASHBOARD_URL', '').strip()

          body = f'''<!doctype html><html><body style="margin:0;background:#f3f6f9;font-family:Arial,'Microsoft YaHei',sans-serif;color:#1d2d3b">
          <div style="max-width:600px;margin:auto;padding:18px">
            <div style="background:#0d2438;color:white;border-radius:10px;padding:18px">
              <div style="font-size:12px;opacity:.75">GLOBAL POLICY INTELLIGENCE</div>
              <div style="font-size:20px;font-weight:bold;margin-top:4px">测试邮件发送成功</div>
            </div>
            <div style="background:white;border:1px solid #e3e8ee;border-radius:10px;padding:18px;margin-top:14px">
              <p>这是一封 GitHub Actions 手动测试邮件。</p>
              <p>收到本邮件说明 Gmail SMTP、GitHub Secrets 和发送脚本均可以正常工作。</p>
              {f'<p><a href="{dashboard}" style="color:#155f92">打开政策情报看板</a></p>' if dashboard else ''}
            </div>
          </div></body></html>'''

          msg = MIMEText(body, 'html', 'utf-8')
          msg['Subject'] = Header('【测试】全球政策情报邮件通知正常', 'utf-8')
          msg['From'] = sender
          msg['To'] = ', '.join(recipients)
          ctx = ssl.create_default_context()

          if port == 465:
              with smtplib.SMTP_SSL(host, port, context=ctx) as smtp:
                  smtp.login(user, password)
                  smtp.sendmail(sender, recipients, msg.as_string())
          else:
              with smtplib.SMTP(host, port) as smtp:
                  smtp.starttls(context=ctx)
                  smtp.login(user, password)
                  smtp.sendmail(sender, recipients, msg.as_string())
          print(f'Test email sent to {len(recipients)} recipient(s).')
          PY

      - name: Keep previous data snapshot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_email == true) }}
        run: cp data.json data.before.json 2>/dev/null || echo '{"items":[]}' > data.before.json

      - name: Collect and analyse
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MAX_NEW_PER_SOURCE: "2"
          MAX_ANALYSIS_PER_RUN: "8"
          MAX_AGE_DAYS: "30"
          FORCE_REANALYZE: "false"
        run: python collector.py

      - name: Detect new important items
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_email == true) }}
        id: detect
        run: python detect_updates.py

      - name: Build mobile email
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_email == true) && steps.detect.outputs.notify_count != '0' }}
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python build_email.py

      - name: Send email
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_email == true) && steps.detect.outputs.notify_count != '0' }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python send_email.py

      - name: Commit data
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_email == true) }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data.json
          [ -f notified.json ] && git add notified.json
          git diff --cached --quiet || git commit -m "Hourly policy intelligence update"
          git pull --rebase --autostash || true
          git push
