name: Update Global Policy Dashboard
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Keep previous data snapshot
        run: cp data.json data.before.json 2>/dev/null || echo '{"items":[]}' > data.before.json
      - name: Collect latest intelligence
        run: python collector.py
      - name: Detect newly-added important items
        id: detect
        run: python detect_updates.py
      - name: Build alert email
        if: steps.detect.outputs.notify_count != '0'
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python build_email.py
      - name: Send email alert
        if: steps.detect.outputs.notify_count != '0'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: file://email_subject.txt
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          html_body: file://email_body.html
      - name: Commit updated data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data.json
          git diff --cached --quiet || git commit -m "Hourly policy intelligence update"
          git push
